# Builds the desktop app's installer. A version tag (v0.2.0) uploads it to a draft GitHub release:
# publish the draft to ship it (installed apps update from published releases). Run the workflow by
# hand to get the installer as a build artifact without a release.
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # build provenance (attestations) for the installer
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        # Windows first. macOS (needs signing and notarization) and Linux: add macos-latest / ubuntu-latest.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not a version like v1.2.3"
              exit 1
            fi
          else
            version="$(node -p "require('./packages/desktop/package.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "APPSHAPE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building AppShape $version"

      - run: pnpm typecheck

      - run: pnpm test

      - name: Stage the app
        run: pnpm --filter @appshape/desktop build

      - name: Build the installer
        working-directory: packages/desktop
        run: pnpm exec electron-builder --config electron-builder.config.cjs --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SHA-256 of every download, for the release page and the website's download page
      - name: Checksums
        shell: bash
        working-directory: packages/desktop/release
        run: |
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # signed provenance: anyone can check the installer was built here, from this commit
      # (`gh attestation verify AppShape-Setup-<version>.exe --repo <owner>/<repo>`); public repositories only
      - name: Build provenance
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/desktop/release/*.exe

      - name: Add the checksums to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" packages/desktop/release/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: appshape-${{ env.APPSHAPE_VERSION }}-${{ matrix.os }}
          path: |
            packages/desktop/release/SHA256SUMS.txt
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/latest*.yml
          if-no-files-found: error
